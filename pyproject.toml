[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscope-eeg-workbench"
version = "0.3.5"
description = "NeuroScope multi-paradigm EEG visualization workbench for Neuracle and BrainCo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.8",
  "mne>=1.6",
  "numpy>=1.26",
  "scipy>=1.12",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
brainco = ["bcigo-sdk==1.0.2"]
desktop = [
  "PySide6-Essentials>=6.7,<6.11",
  "pyedflib>=0.1.40,<0.2",
  "pyqtgraph>=0.13.7,<0.15",
  "sounddevice>=0.5,<0.6",
]

[project.scripts]
neuroscope-doctor = "neuroscope_eeg.diagnostics.environment:main"
neuroscope-bundle = "neuroscope_eeg.io.diagnostic_bundle:main"
neuroscope-desktop = "neuroscope_eeg.desktop.app:main"

[tool.setuptools.packages.find]
include = ["neuroscope_eeg*"]

[tool.setuptools.package-data]
neuroscope_eeg = ["assets/emotion_arousal/*.md", "assets/emotion_arousal/*.json", "assets/emotion_arousal/images/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
